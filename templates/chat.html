<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical AI Assistant</title>

    <!-- Website Tab Icon (Favicon) -->
    <link
        rel="icon"
        type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230d9488'/%3E%3Cpath d='M25 18v25a25 25 0 0 0 50 0V18M15 18h20M65 18h20' fill='none' stroke='white' stroke-width='8' stroke-linecap='round'/%3E%3Ccircle cx='75' cy='65' r='12' fill='none' stroke='white' stroke-width='7'/%3E%3C/svg%3E">

    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="https://use.fontawesome.com/releases/v5.5.0/css/all.css">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
<div class="app-shell">
    <div class="chat-card">

        <header class="chat-header">
            <div class="header-identity">
                <div class="header-avatar">
                    <i class="fas fa-stethoscope"></i>
                    <span class="online-indicator"></span>
                </div>

                <div class="header-info">
                    <div class="header-title">Medical AI Assistant</div>
                    <div class="header-status">
                        <span class="status-dot"></span>
                        Online · Ready to help
                    </div>
                </div>
            </div>

            <button id="themeToggle"
                    class="theme-btn"
                    type="button"
                    aria-label="Toggle theme"
                    title="Toggle theme">
                <i class="fas fa-moon"></i>
            </button>
        </header>

        <main id="messageFormeight" class="chat-messages">

            <!-- Permanent welcome message -->
            <div class="message-row bot-row welcome-row">
                <div class="avatar-column">
                    <div class="message-avatar">
                        <i class="fas fa-stethoscope"></i>
                    </div>
                </div>

                <div class="message-bubble bot-bubble">
                    <div class="message-content">Hello! 👋
I'm your Medical AI Assistant. How can I help you today?</div>
                    <div class="message-time">Now</div>
                </div>

                <div class="copy-slot">
                    <button class="copy-btn"
                            type="button"
                            title="Copy message"
                            aria-label="Copy welcome message">
                        <i class="far fa-copy"></i>
                    </button>
                </div>
            </div>

        </main>

        <footer class="chat-footer">
            <form id="messageArea" class="message-form">
                <input
                    type="text"
                    id="text"
                    name="msg"
                    class="message-input"
                    placeholder="Ask your medical question..."
                    autocomplete="off"
                    required
                >

                <button type="submit"
                        id="send"
                        class="send-btn"
                        aria-label="Send message"
                        title="Send message">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </form>
        </footer>

    </div>
</div>

<script>
(() => {
    const messages = document.getElementById("messageFormeight");
    const form = document.getElementById("messageArea");
    const input = document.getElementById("text");
    const sendButton = document.getElementById("send");
    const themeButton = document.getElementById("themeToggle");

    const WORD_DELAY_MS = 45;

    // ------------------------------
    // Theme
    // ------------------------------

    function updateThemeIcon() {
        const isLight = document.body.classList.contains("light-mode");
        const icon = themeButton.querySelector("i");

        icon.classList.toggle("fa-moon", !isLight);
        icon.classList.toggle("fa-sun", isLight);
    }

    if (localStorage.getItem("chatbot-theme") === "light") {
        document.body.classList.add("light-mode");
    }

    updateThemeIcon();

    themeButton.addEventListener("click", () => {
        document.body.classList.toggle("light-mode");

        localStorage.setItem(
            "chatbot-theme",
            document.body.classList.contains("light-mode")
                ? "light"
                : "dark"
        );

        updateThemeIcon();
    });

    // ------------------------------
    // Helpers
    // ------------------------------

    function getTime() {
        return new Date().toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit",
            hour12: false
        });
    }

    function scrollToBottom() {
        messages.scrollTop = messages.scrollHeight;
    }

    function createElement(tag, className, text = "") {
        const element = document.createElement(tag);
        element.className = className;
        element.textContent = text;
        return element;
    }

    function createCopyButton() {
        const slot = createElement("div", "copy-slot");

        const button = document.createElement("button");
        button.type = "button";
        button.className = "copy-btn";
        button.title = "Copy message";
        button.setAttribute("aria-label", "Copy message");
        button.innerHTML = '<i class="far fa-copy"></i>';

        slot.appendChild(button);
        return slot;
    }

    function createAvatar(isUser) {
        const column = createElement("div", "avatar-column");

        if (isUser) {
            const image = document.createElement("img");
            image.className = "user-avatar";
            image.src = "https://i.ibb.co/d5b84Xw/Untitled-design.png";
            image.alt = "User";
            column.appendChild(image);
        } else {
            const avatar = createElement("div", "message-avatar");
            avatar.innerHTML = '<i class="fas fa-stethoscope"></i>';
            column.appendChild(avatar);
        }

        return column;
    }

    function createBubble(isUser, initialText = "") {
        const bubble = createElement(
            "div",
            "message-bubble " + (isUser ? "user-bubble" : "bot-bubble")
        );

        const content = createElement(
            "div",
            "message-content",
            initialText
        );

        const time = createElement(
            "div",
            "message-time",
            getTime()
        );

        bubble.append(content, time);

        return { bubble, content };
    }

    function createUserRow(question) {
        const row = createElement("div", "message-row user-row");
        const { bubble } = createBubble(true, question);

        row.append(
            createCopyButton(),
            bubble,
            createAvatar(true)
        );

        return row;
    }

    function createBotRow() {
        const row = createElement("div", "message-row bot-row");
        const { bubble, content } = createBubble(false, "Thinking...");

        content.classList.add("thinking-indicator");

        const copySlot = createCopyButton();
        copySlot.hidden = true;

        row.append(
            createAvatar(false),
            bubble,
            copySlot
        );

        return { row, content, copySlot };
    }

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    // ------------------------------
    // Copy button
    // ------------------------------

    document.addEventListener("click", async event => {
        const button = event.target.closest(".copy-btn");
        if (!button) return;

        const row = button.closest(".message-row");
        const content = row?.querySelector(".message-content");

        if (!content) return;

        if (
            content.classList.contains("thinking-indicator") ||
            content.classList.contains("typing-indicator")
        ) {
            return;
        }

        const text = content.textContent.trim();
        if (!text) return;

        try {
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(text);
            } else {
                const textarea = document.createElement("textarea");
                textarea.value = text;
                textarea.style.position = "fixed";
                textarea.style.opacity = "0";

                document.body.appendChild(textarea);
                textarea.select();

                const copied = document.execCommand("copy");
                textarea.remove();

                if (!copied) throw new Error("Copy failed");
            }

            const previous = button.innerHTML;

            button.innerHTML = '<i class="fas fa-check"></i>';
            button.title = "Copied!";

            setTimeout(() => {
                button.innerHTML = previous;
                button.title = "Copy message";
            }, 1000);

        } catch (error) {
            console.error("Unable to copy:", error);
            button.title = "Unable to copy";
        }
    });

    // ------------------------------
    // Stream and animate the answer
    // ------------------------------

    async function readAnswer(response, content, copySlot) {
        if (!response.ok) {
            const errorText = await response.text();
            throw new Error(errorText || `HTTP ${response.status}`);
        }

        if (!response.body) {
            throw new Error("Streaming is unavailable in this browser.");
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");

        let pending = "";
        let fullAnswer = "";
        let hasStarted = false;

        async function displayText(text, flush = false) {
            pending += text.replace(/\*\*/g, "");

            // Preserve incomplete words between incoming chunks.
            const lastWhitespace = Math.max(
                pending.lastIndexOf(" "),
                pending.lastIndexOf("\n"),
                pending.lastIndexOf("\t"),
                pending.lastIndexOf("\r")
            );

            let ready;
            if (flush) {
                ready = pending;
                pending = "";
            } else if (lastWhitespace >= 0) {
                ready = pending.slice(0, lastWhitespace + 1);
                pending = pending.slice(lastWhitespace + 1);
            } else {
                return;
            }

            if (!ready) return;

            if (!hasStarted && ready.trim()) {
                hasStarted = true;
                content.textContent = "";
                content.classList.remove("thinking-indicator");
                content.classList.add("typing-indicator");
            }

            if (!hasStarted) return;

            const tokens = ready.match(/\S+\s*|\s+/g) || [];

            for (const token of tokens) {
                content.appendChild(document.createTextNode(token));
                fullAnswer += token;
                scrollToBottom();

                if (token.trim()) {
                    await sleep(WORD_DELAY_MS);
                }
            }
        }

        while (true) {
            const result = await reader.read();

            if (result.done) break;

            await displayText(
                decoder.decode(result.value, { stream: true })
            );
        }

        await displayText(decoder.decode(), true);
        await displayText("", true);

        content.classList.remove(
            "thinking-indicator",
            "typing-indicator"
        );

        if (!fullAnswer.trim()) {
            throw new Error("The assistant returned an empty response.");
        }

        content.textContent = fullAnswer.trim();

        // Copy becomes visible only when the answer has finished.
        copySlot.hidden = false;

        scrollToBottom();
    }

    // ------------------------------
    // Submit a question
    // ------------------------------

    form.addEventListener("submit", async event => {
        event.preventDefault();

        const question = input.value.trim();
        if (!question || sendButton.disabled) return;

        input.value = "";
        sendButton.disabled = true;
        input.focus();

        const userRow = createUserRow(question);
        const bot = createBotRow();

        messages.append(userRow, bot.row);
        scrollToBottom();

        try {
            const response = await fetch("/get", {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/x-www-form-urlencoded;charset=UTF-8"
                },
                body: new URLSearchParams({ msg: question })
            });

            await readAnswer(response, bot.content, bot.copySlot);

        } catch (error) {
            console.error("Assistant request failed:", error);

            bot.content.classList.remove(
                "thinking-indicator",
                "typing-indicator"
            );

            bot.content.textContent =
                "Sorry, something went wrong. Please try again.";

            bot.copySlot.hidden = false;

        } finally {
            sendButton.disabled = false;
            input.focus();
            scrollToBottom();
        }
    });
})();
</script>
</body>
</html>
